<!doctype html>
<meta charset="utf-8" />
<title>Black-Bag</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #060a07;
    --fg: #c6f5d5;
    --accent: #00ff41;
    --urgent: #ff2f2f;
    --muted: #2b4a37;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 "CaskaydiaMono Nerd Font", "JetBrains Mono", ui-monospace, monospace;
  }
  main { width: min(680px, 88vw); }
  h1 {
    margin: 0 0 4px;
    font-size: 13px;
    letter-spacing: 4px;
    font-weight: 700;
    color: color-mix(in srgb, var(--fg) 85%, transparent);
  }
  .sub {
    margin: 0 0 32px;
    font-size: 11px;
    letter-spacing: 1.6px;
    color: color-mix(in srgb, var(--fg) 45%, transparent);
  }
  .origin {
    padding: 20px 22px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    border-radius: 3px;
    font-size: 21px;
    font-weight: 700;
    word-break: break-all;
  }
  .origin .dim { color: color-mix(in srgb, var(--fg) 35%, transparent); }
  .origin .core { color: var(--accent); }
  .label {
    margin: 26px 0 6px;
    font-size: 11px;
    letter-spacing: 1.4px;
    color: color-mix(in srgb, var(--fg) 45%, transparent);
  }
  .look {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 30px;
    padding: 16px 20px;
    border: 1px solid color-mix(in srgb, var(--muted) 70%, transparent);
    border-radius: 3px;
  }
  .pulse {
    width: 9px; height: 9px; flex: none;
    border-radius: 50%;
    background: var(--accent);
    animation: beat 1.4s ease-in-out infinite;
  }
  @keyframes beat { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .note { margin-top: 22px; font-size: 12px; color: color-mix(in srgb, var(--fg) 50%, transparent); }
  .err { color: var(--urgent); }
  .done { color: var(--accent); }
</style>

<main>
  <h1>BLACK-BAG</h1>
  <p class="sub" id="kind">PASSKEY</p>

  <div class="origin" id="origin"></div>

  <div class="look">
    <span class="pulse" id="pulse"></span>
    <span id="state">Waiting for you to approve this in Black-Bag.</span>
  </div>

  <p class="note">
    Black-Bag will ask for your master passphrase. It asks even though the
    vault is open, because a signature is a login and this page cannot prove
    to it who is asking. <b>Nothing is approved here.</b>
  </p>
  <p class="note" id="detail"></p>
</main>

<script src="ceremony.js"></script>
