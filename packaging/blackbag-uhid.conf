# Load the kernel's virtual-HID driver at boot.
#
# /dev/uhid exists as a static node even when the module is not loaded, and
# opening it is what would normally pull the module in. That does not work
# here: the static node is root-only, so a non-root open fails with EACCES
# before the kernel gets as far as autoloading anything — and until the module
# IS loaded there is no real device for udev to apply the uaccess rule to.
#
# So the module has to be loaded first, and the rule applies to the device that
# appears when it is.
#
# Install:
#   sudo install -m644 packaging/blackbag-uhid.conf /etc/modules-load.d/
#
# Or once, without a reboot:
#   sudo modprobe uhid
uhid
