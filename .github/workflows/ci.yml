name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace

      - name: Test
        run: cargo test --workspace

      # Called out separately so a failure here is legible in the log: this is
      # a real relying party from another project accepting — or refusing —
      # what our authenticator produces, and it is the check most likely to
      # notice a WebAuthn regression we would otherwise not see until a site
      # rejected a login.
      - name: A real relying party accepts our passkeys
        run: cargo test -p blackbag-core --test webauthn_rs_relying_party -- --nocapture

      # The project's standard is zero warnings, so a warning fails the build
      # rather than scrolling past in a log nobody reads.
      - name: No warnings
        run: |
          touch crates/blackbag-core/src/lib.rs
          count=$(cargo build --release --workspace 2>&1 | grep -c '^warning' || true)
          echo "warnings: $count"
          test "$count" -eq 0

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  surfaces:
    name: plugin logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model.js assertions
        run: plugin/khephri.blackbag/tests/run.sh

      # Invariants about the QML that no type checker can see. Each rule is
      # there because breaking it caused a real failure — see the comments in
      # the file, which name the failure each one prevents.
      - name: Deck structural invariants
        run: python3 plugin/khephri.blackbag/tests/structure.py

      - name: Extension encoding assertions
        run: node extension/tests/encoding.test.js

      # Structural invariants: one listener per event, one definition per
      # function, no surface that can approve but the one that asks for a
      # passphrase. A block of sw.js was once pasted twice and every login
      # opened two full-screen ceremony windows, stacked and identical.
      - name: Extension structural invariants
        run: node extension/tests/structure.test.js

      # docs/COMPAT.md is what somebody reads when a browser update breaks
      # passkeys. Documentation that has quietly stopped matching the code
      # sends them to check the wrong thing.
      - name: The documented API surface matches the code
        run: node extension/tests/api-surface.test.js

      # A hook nobody has seen fail is a hook nobody knows works. This stages
      # a private key, three kinds of token and a vault file in a throwaway
      # repository and fails if any of them get through.
      - name: The pre-commit secret scan still blocks
        run: .githooks/selftest.sh

      # Cockpit.qml, Editor.qml and Model.js are one surface with two hosts.
      # This is what stops a fix landing in the plugin and never reaching the
      # application, which is the drift this repository has already been bitten
      # by once.
      - name: Desktop QML is in step with the plugin
        run: python3 desktop/port-from-plugin.py --check

  desktop:
    name: desktop application
    runs-on: ubuntu-latest
    # Arch, because that is what Omarchy is and what this application is
    # actually run on. ubuntu-latest ships Qt 6.4.2, below this project's 6.5
    # floor; rather than lower a floor that has never been tested at 6.4, CI
    # builds where the users are.
    container: archlinux:latest
    steps:
      - name: Toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git python \
            qt6-base qt6-declarative qt6-svg \
            desktop-file-utils

      - uses: actions/checkout@v4

      - name: Qt version
        run: cmake --version && qmake6 --version

      - name: Configure
        run: cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build desktop/build

      # Same standard as the engine: a warning is a failure, not a line in a
      # log nobody reads.
      - name: No warnings
        run: |
          rm -rf desktop/build
          cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release >/dev/null
          count=$(cmake --build desktop/build 2>&1 | grep -ci 'warning' || true)
          echo "warnings: $count"
          test "$count" -eq 0

      - name: Desktop entry is spec-clean
        run: desktop-file-validate desktop/packaging/dev.blackbag.Deck.desktop
